<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Suas páginas estão no ar</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; color: #111827; background: #f3f4f6; }
      main { width: min(100%, 680px); padding: clamp(28px, 7vw, 56px); border: 1px solid #e5e7eb; border-radius: 24px; background: white; box-shadow: 0 24px 70px #11182712; }
      .tag { display: inline-flex; padding: 7px 11px; border-radius: 999px; color: #047857; background: #ecfdf5; font-size: 13px; font-weight: 700; }
      h1 { margin: 22px 0 12px; font-size: clamp(34px, 7vw, 52px); line-height: 1.04; letter-spacing: -.045em; }
      p { color: #4b5563; font-size: 17px; line-height: 1.65; }
      code { padding: 3px 7px; border-radius: 6px; color: #111827; background: #f3f4f6; font-size: .9em; }
      .note { margin-top: 28px; padding: 16px 18px; border-left: 3px solid #10b981; border-radius: 8px; background: #f9fafb; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Cloudflare Pages</span>
      <h1>Seu espaço de páginas está pronto.</h1>
      <p>Crie uma pasta para cada página e coloque um <code>index.html</code> dentro dela. O nome da pasta será o slug da URL.</p>
      <div class="note">Exemplo: <code>meu-projeto/index.html</code> será publicado em <code>/meu-projeto/</code>.</div>
    </main>
  </body>
</html>
